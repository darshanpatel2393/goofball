<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>In My Own Words · Sonuuu</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-gift="8">
<main class="wrap center">
  <span class="tag">✦ In My Own Words</span>

  <section class="card" id="game">
    <h2>Something from my heart 💙</h2>
    <p class="hint">Press and hold the heart until the ring fills up.</p>
    <button id="hold" aria-label="Hold the heart"><span>💙</span></button>
  </section>

  <section class="card reveal" id="voice" hidden>
    <h2 class="script">Press play, Sonuuu 🎧</h2>
    <video controls playsinline preload="metadata" src="media/video.mp4" poster="images/video-poster.JPG"></video>
  </section>

  <section class="card reveal" id="letter" hidden>
    <h2 class="script">A letter for you</h2>
    <!-- EDIT YOUR LETTER in data-text below. Tap the letter to show it all at once. -->
    <p class="letter" id="lt" data-text="Dear Sonuuu,&#10;&#10;Happy Birthday to my Home Girl, my favourite person to talk to, and the one who makes ordinary days feel special.&#10;&#10;Thank you for every laugh, every late-night talk, and every time you stayed when it was hard. I don't say it enough, but you matter so much to me.&#10;&#10;I hope this year gives you all your heart wants. Keep creating, keep shining,keep smiling, keep growing, stay healthy, and never forget how loved you are.💖&#10;&#10;"></p>
  </section>

  <section class="reveal" id="more" hidden>
    <p class="nextwrap"><a class="btn" href="surprise9.html">Time to make a wish 🎂</a></p>
  </section>
</main>
<script src="js/app.js"></script>
<script src="js/g8.js"></script>
</body>
</html>
