<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Catch a Wish · Sonuuu</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-gift="4">
<main class="wrap">
  <span class="tag">✦ Catch a Wish</span>
  <section class="card center" id="game">
    <h2>Catch it if you can ✨</h2>
    <p class="hint">It gets faster every time. Catch it 7 times!</p>
    <div class="sky" id="sky">
      <div class="catchme" id="catchme" role="button" aria-label="Catch the star">
        <svg viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="46" fill="#7cc4ff" opacity=".22"/>
          <polygon points="50,10 60.5,38 90,38 66,56 75,86 50,68 25,86 34,56 10,38 39.5,38"
            fill="#7cc4ff" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
    <p class="hint" id="count">0 / 7 caught</p>
  </section>

  <section class="card reveal" id="gift" hidden>
    <div class="photo" data-src="images/s4.jpg" data-label="Surprise four"></div>
    <h2 class="script">Your little blue chaos buddy</h2>
    <!-- EDIT YOUR MESSAGE in data-text below -->
    <p class="msg" id="msg" data-text="You caught it! Meet your new partner in dreams: blue, a little wild, and completely loyal. Ohana means family, and you are mine.&#10;&#10;Keep it close on stressful days, hug it on the sad ones, and remember you are my favourite person. janmdin diyan lakh lakh vadhaiyan Sonuuu"></p>
    <p class="nextwrap"><a class="btn" href="surprise5.html">Catch the next wish 🌠</a></p>
  </section>
</main>
<script src="js/app.js"></script>
<script src="js/g4.js"></script>
</body>
</html>
