<title>Made Just For You · Sonuuu</title>
<link rel="stylesheet" href="css/style.css">

<body data-gift="5">
<main class="wrap">
  <span class="tag">✦ Made Just For You</span>
  <section class="card center" id="game">
    <h2>Find the sweet spot 🎯</h2>
    <p class="hint">Tap Stop when the needle is inside the glowing zone. Do it 3 times.</p>
    <div class="meter" id="meter"><div class="zone" id="zone"></div><div class="needle" id="needle"></div></div>
    <button class="btn" id="stop">Stop</button>
    <p class="hint" id="count">0 / 3</p>
    <p class="fb" id="fb"></p>
  </section>

  <section class="card reveal" id="gift" hidden>
    <div class="photo" data-src="images/s5.JPEG" data-label="Surprise five"></div>
    <h2 class="script">Made with my own hands</h2>
    <!-- EDIT YOUR MESSAGE in data-text below (tell her what you made and why) -->
    <p class="msg" id="msg" data-text="This one is not from a shop. I made it for you myself😋, a little messy, a little nervous, and with a lot of love.&#10;&#10;It may not be perfect, I hope it makes you smile. shubho jonmodin Sonuu"></p>
    <p class="nextwrap"><a class="btn" href="surprise1.html">Let's look back 📷</a></p>
  </section>
</main>
<script src="js/app.js"></script>
<script src="js/g5.js"></script>
