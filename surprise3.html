<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>A Splash of Sonuuu · Sonuuu</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-gift="3">
<main class="wrap">
  <span class="tag">✦ A Splash of Sonuuu</span>
  <section class="card center" id="game">
    <h2>Paint something 🎨</h2>
    <p class="hint">Use all 5 colours on the canvas. Scribble, doodle, whatever you feel.</p>
    <canvas id="paint"></canvas>
    <div class="pots" id="pots">
      <button class="pot sel" data-c="#4c80fb" style="background:#4c80fb" aria-label="Sky blue"></button>
      <button class="pot" data-c="#2c9c06" style="background:#2c9c06" aria-label="Leaf Green"></button>
      <button class="pot" data-c="#ff8fb1" style="background:#ff8fb1" aria-label="Tulip pink"></button>
      <button class="pot" data-c="#f8c54f" style="background:#f8c54f" aria-label="Sunshine"></button>
      <button class="pot" data-c="#692a03" style="background:#692a03" aria-label="Browm"></button>
    </div>
    <p class="hint" id="count">0 / 5 colours used</p>
  </section>

  <section class="card reveal" id="gift" hidden>
    <div class="photo" data-src="images/s3.jpg" data-label="Surprise three"></div>
    <h2 class="script">For your beautiful hands</h2>
    <!-- EDIT YOUR MESSAGE in data-text below -->
    <p class="msg" id="msg" data-text="For the girl who makes the world prettier with her art. I hope these colours never run out, and neither do your ideas.&#10;&#10;Paint something for me 👉👈. Paint the bad days away. Paint whatever you feel hehehe."></p>
    <p class="nextwrap"><a class="btn" href="surprise4.html">Colour outside the lines 🎨</a></p>
  </section>
</main>
<script src="js/app.js"></script>
<script src="js/g3.js"></script>
</body>
</html>
